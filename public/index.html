<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFreeAI - Only Free. Only AI.</title>
    <style>
        :root {
            --indigo: #6366F1;
            --indigo-light: #818CF8;
            --emerald: #10B981;
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-primary: #1E1E2E;
            --text-secondary: #64748B;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero {
            text-align: center;
            padding: 60px 24px;
            max-width: 560px;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: var(--indigo);
        }

        .logo span { color: var(--emerald); }

        .tagline {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .description {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
        }

        .links a.primary {
            background: var(--indigo);
            color: white;
        }

        .links a.secondary {
            background: var(--card-bg);
            color: var(--indigo);
            border: 1px solid var(--border);
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .logo { font-size: 36px; }
            .links { flex-direction: column; align-items: center; }
            .links a { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">OnlyFree<span>AI</span></div>
        <div class="tagline">Only Free. Only AI.</div>
        <p class="description">
            The curated directory of verified free AI tools. Browse, search, and discover genuinely free AI tools — no trials, no credit cards, no hidden paywalls.
        </p>
        <div class="links">
            <a href="/privacy-policy.html" class="primary">Privacy Policy</a>
            <a href="/terms-of-service.html" class="secondary">Terms of Service</a>
        </div>
    </div>

    <footer>&copy; 2026 OnlyFreeAI. All rights reserved.</footer>
</body>
</html>
